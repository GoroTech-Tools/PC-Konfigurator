name: Build and release PC-Konfigurator

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Create build virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Install Markdown lint tooling
        shell: pwsh
        run: npm install --global markdownlint-cli

      - name: Increment version for main build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $path = 'src/build_info.py'
          $content = Get-Content $path -Raw
          if ($content -notmatch "'version': '(\d+)\.(\d+)\.(\d+)'") {
            throw "Build-Version in $path konnte nicht ermittelt werden."
          }
          $latestVersion = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
          foreach ($tag in (git tag --list 'v[0-9]*')) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $tagVersion = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
              if ($tagVersion -gt $latestVersion) {
                $latestVersion = $tagVersion
              }
            }
          }
          $version = "$($latestVersion.Major).$($latestVersion.Minor).$($latestVersion.Build + 1)"
          $content = $content -replace "'version': '\d+\.\d+\.\d+'", "'version': '$version'"
          $content = $content -replace "'build_date': '[^']+'", "'build_date': '$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ss')'"
          Set-Content $path $content -Encoding UTF8
          Write-Host "Neue Main-Build-Version: $version"

      - name: Align build version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Ungültiger Release-Tag: $env:RELEASE_TAG"
          }
          $version = $Matches[1]
          $path = 'src/build_info.py'
          $content = Get-Content $path -Raw
          $updated = $content -replace "'version': '\d+\.\d+\.\d+'", "'version': '$version'"
          Set-Content $path $updated -Encoding UTF8
          Write-Host "Build-Version auf $version gesetzt."

      - name: Build and package application
        shell: pwsh
        run: .\build.ps1 -PreferredVenv .venv -NoVersionBump

      - name: Upload build directory
        uses: actions/upload-artifact@v7
        with:
          name: PC-Konfigurator-${{ github.sha }}
          path: |
            dist/PC-Konfigurator-v*/
            release/RELEASE_NOTES_v*.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: PC-Konfigurator-release-${{ github.sha }}
          path: release/PC-Konfigurator-v*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: PC-Konfigurator-release-${{ github.sha }}
          path: release

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: PC-Konfigurator-${{ github.sha }}
          path: build-artifact

      - name: Locate release notes
        id: release_notes
        shell: bash
        run: |
          notes_path="$(find build-artifact/release -maxdepth 1 -name 'RELEASE_NOTES_v*.md' -print -quit)"
          test -n "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"
          version="${notes_path##*/RELEASE_NOTES_v}"
          version="${version%.md}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.release_notes.outputs.version) }}
          name: PC-Konfigurator ${{ steps.release_notes.outputs.version }}
          files: release/PC-Konfigurator-v*.zip
          fail_on_unmatched_files: true
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
